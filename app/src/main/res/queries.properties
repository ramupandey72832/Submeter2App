# ==============================================================================
# SQLITE DATABASE SCHEMA PROPERTIES
# App: Submeter Billing Application
# Use: Load these strings directly into your Java/Kotlin database initialization
# ==============================================================================

# Enable Foreign Key Support (Must be executed before creating tables)
schema.enable_foreign_keys=PRAGMA foreign_keys = ON;
schema.disable_foreign_keys=PRAGMA foreign_keys = OFF;

# 1. Rooms Table
schema.create_room_table=CREATE TABLE IF NOT EXISTS rooms (\
    id INTEGER PRIMARY KEY AUTOINCREMENT,\
    room_number TEXT,\
    room_type TEXT\
);

# 2. Submeters Table
schema.create_submeter_table=CREATE TABLE IF NOT EXISTS submeters (\
    id INTEGER PRIMARY KEY AUTOINCREMENT,\
    meter_serial_number TEXT NOT NULL UNIQUE,\
    initial_reading INTEGER NOT NULL DEFAULT 0 CHECK (initial_reading >= 0),\
    note TEXT\
);

# 3. Tenants Table
schema.create_tenant_table=CREATE TABLE IF NOT EXISTS tenants (\
    id INTEGER PRIMARY KEY AUTOINCREMENT,\
    name TEXT NOT NULL,\
    phone_number TEXT NOT NULL,\
    aadhaar_number TEXT,\
    address TEXT\
);


# 4. Meter Readings Table
schema.create_meter_reading_table=CREATE TABLE IF NOT EXISTS meter_readings (\
    id INTEGER PRIMARY KEY AUTOINCREMENT,\
    meter_id INTEGER NOT NULL,\
    reading_value INTEGER NOT NULL CHECK (reading_value >= 0),\
    reading_date TEXT NOT NULL,\
    image_url_or_path TEXT,\
    FOREIGN KEY (meter_id) REFERENCES submeters(id) ON DELETE RESTRICT\
);

# 5. Tenancy (Mapping Rooms to Tenants)
schema.create_tenancy_table=CREATE TABLE IF NOT EXISTS tenancy (\
    id INTEGER PRIMARY KEY AUTOINCREMENT,\
    room_id INTEGER NOT NULL,\
    tenant_id INTEGER NOT NULL,\
    start_date TEXT NOT NULL,\
    end_date TEXT,\
    FOREIGN KEY (room_id) REFERENCES rooms(id) ON DELETE RESTRICT,\
    FOREIGN KEY (tenant_id) REFERENCES tenants(id) ON DELETE RESTRICT\
);


# 6. Submeter Allocation ( Mapping Meters to Room)
schema.create_submeter_allocation_table=CREATE TABLE IF NOT EXISTS submeter_allocations (\
id INTEGER PRIMARY KEY AUTOINCREMENT,\
meter_id INTEGER NOT NULL,\
room_id INTEGER NOT NULL,\
starting_date TEXT NOT NULL,\
ending_date TEXT,\
FOREIGN KEY (meter_id) REFERENCES submeters(id) ON DELETE RESTRICT,\
FOREIGN KEY (room_id) REFERENCES rooms(id) ON DELETE RESTRICT\
);


# 7. Bill Table
schema.create_bills_table=CREATE TABLE IF NOT EXISTS bills (\
id INTEGER PRIMARY KEY AUTOINCREMENT,\
meter_id INTEGER NOT NULL,\
room_number TEXT NOT NULL,\
tenant_id INTEGER NOT NULL,\
tenant_name TEXT NOT NULL,\
meter_serial_number TEXT NOT NULL,\
previous_reading_id INTEGER NOT NULL,\
current_reading_id INTEGER NOT NULL,\
current_reading INTEGER,\
previous_reading INTEGER,\
units_consumed INTEGER,\
rate_per_unit REAL,\
fixed_charge REAL,\
extra_charge REAL,\
total_amount REAL,\
note TEXT,\
billing_date TEXT,\
FOREIGN KEY (meter_id) REFERENCES submeters(id) ON DELETE RESTRICT,\
FOREIGN KEY (tenant_id) REFERENCES tenants(id) ON DELETE RESTRICT,\
FOREIGN KEY (previous_reading_id) REFERENCES meter_readings(id) ON DELETE RESTRICT,\
FOREIGN KEY (current_reading_id) REFERENCES meter_readings(id) ON DELETE RESTRICT\
);


# 8. Payment Table
schema.create_payments_table =CREATE TABLE IF NOT EXISTS payments (\
id INTEGER PRIMARY KEY AUTOINCREMENT,\
bill_id INTEGER,\
amount_paid INTEGER,\
payment_date TEXT,\
note TEXT,\
FOREIGN KEY (bill_id) REFERENCES bills(id) ON DELETE RESTRICT\
);


# ==============================================================================
# UPDATED SQLITE QUERIES PROPERTIES (EXPLICIT JOIN VERSION - NO VIEWS)
# ==============================================================================






# ==============================================================================
# SCHEMA CLEANUP / RESET QUERIES
# ==============================================================================


# Drop View (Must happen before dropping underlying tables)

# Drop Tables in strict dependency order (Child dependencies first)
schema.drop_bills_table=DROP TABLE IF EXISTS bills;
schema.drop_meter_readings_table=DROP TABLE IF EXISTS meter_readings;
schema.drop_submeters_table=DROP TABLE IF EXISTS submeters;
schema.drop_tenancy_table=DROP TABLE IF EXISTS tenancy;
schema.drop_submeter_allocation_table=DROP TABLE IF EXISTS submeter_allocations;
schema.drop_payment_table=DROP TABLE IF EXISTS payments;
schema.drop_rooms_table=DROP TABLE IF EXISTS rooms;
schema.drop_tenants_table=DROP TABLE IF EXISTS tenants;


